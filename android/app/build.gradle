apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Release signing reads android/keystore.properties, which is never committed.
 * Debug builds fall back to the standard debug key.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mps.fileconverter"

    defaultConfig {
        applicationId "com.mps.fileconverter"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // Bump both together at the end of a batch of changes, before every Play upload.
        versionCode 2
        versionName "1.0.1"

        multiDexEnabled true
        resourceConfigurations += ["en"]

        // react-native-iap ships play/amazon flavors; billing here is Google Play only.
        missingDimensionStrategy 'store', 'play'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*',
                    'META-INF/INDEX.LIST',
            ]
        }
    }

    compileOptions {
        // commons-compress and junrar call newer java.* APIs than API 24 ships with.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    bundle {
        language { enableSplit = false }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.3"

    // Offline PDF text extraction. Nothing here touches the network.
    implementation "com.tom-roush:pdfbox-android:2.0.27.0"

    // Archive decoders, all pure JVM so extraction works with no connection.
    implementation "net.lingala.zip4j:zip4j:2.11.5"              // ZIP, incl. ZipCrypto and AES
    implementation "org.apache.commons:commons-compress:1.27.1"  // 7z, tar, gz, bz2, xz
    implementation "org.tukaani:xz:1.10"                         // xz support for the above
    implementation "com.github.junrar:junrar:7.5.5"              // RAR4

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
